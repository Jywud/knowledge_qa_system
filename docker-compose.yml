services:
  db:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.pgvector
    image: knowledge-qa/pg16-zhparser:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_qa"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/knowledge_qa
      UPLOAD_DIR: /app/uploads
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      TOP_K: ${TOP_K:-5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_OPENAI_BASE_URL: ${EMBED_OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBED_OPENAI_API_KEY: ${EMBED_OPENAI_API_KEY:-}
      EMBED_OPENAI_DIMENSIONS: ${EMBED_OPENAI_DIMENSIONS:-1024}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1-flash}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      TRUSTED_PROXY_IPS: ${QA_PROXY_IP:-172.30.250.3}
    volumes:
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - proxy_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      proxy_net:
        ipv4_address: ${QA_PROXY_IP:-172.30.250.3}

networks:
  proxy_net:
    ipam:
      config:
        - subnet: ${QA_PROXY_SUBNET:-172.30.250.0/24}

volumes:
  pg_data:
  uploads_data:
